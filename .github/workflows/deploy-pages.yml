name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cp CNAME dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines with IndexNow
        run: |
          curl --fail-with-body -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            --data '{"host":"sundata.tech","key":"57f45e60-67c1-42e7-8973-fe4dbe76c092","keyLocation":"https://sundata.tech/57f45e60-67c1-42e7-8973-fe4dbe76c092.txt","urlList":["https://sundata.tech/","https://sundata.tech/guides/japan-passport-photo.html","https://sundata.tech/guides/us-passport-photo.html","https://sundata.tech/guides/35x45-photo.html"]}'
